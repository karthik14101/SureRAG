# SURE-GraphRAG :: local infrastructure
# Brings up the two databases the engine needs. SQLite is a plain file (no container).
#
#   docker compose up -d          # start
#   docker compose ps             # check health
#   docker compose down           # stop (data is kept in ./docker volumes)
#   docker compose down -v        # stop AND wipe all vector/graph data
#
# Tags are pinned to versions verified to exist on Docker Hub.
# Qdrant must be >= 1.10 for the Query API (prefetch + RRF fusion) used by the
# hybrid retriever in app/vectorstore/search.py.

services:
  qdrant:
    image: qdrant/qdrant:v1.19.1
    container_name: sure_qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"   # REST API + web dashboard  -> http://localhost:6333/dashboard
      - "6334:6334"   # gRPC API
    volumes:
      - ./docker/qdrant_storage:/qdrant/storage
    environment:
      QDRANT__SERVICE__ENABLE_CORS: "true"
      QDRANT__LOG_LEVEL: "INFO"
    healthcheck:
      # The Qdrant image is distroless (no curl/wget), so we probe with its own binary.
      test: ["CMD", "/qdrant/qdrant", "--version"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  neo4j:
    image: neo4j:5.26-community
    container_name: sure_neo4j
    restart: unless-stopped
    ports:
      - "7474:7474"   # HTTP browser -> http://localhost:7474
      - "7687:7687"   # Bolt driver (used by the backend)
    volumes:
      - ./docker/neo4j_data:/data
      - ./docker/neo4j_logs:/logs
    environment:
      # Format is user/password. Must match NEO4J_USER / NEO4J_PASSWORD in your .env
      NEO4J_AUTH: "neo4j/sureGraph2024"
      NEO4J_server_memory_heap_initial__size: "512m"
      NEO4J_server_memory_heap_max__size: "1G"
      NEO4J_server_memory_pagecache_size: "512m"
      NEO4J_db_transaction_timeout: "60s"
      NEO4J_server_default__listen__address: "0.0.0.0"
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p sureGraph2024 'RETURN 1' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 45s
